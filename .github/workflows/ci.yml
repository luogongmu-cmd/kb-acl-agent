name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: dummy
      LLM_BASE_URL: https://example.com/v1
      LLM_MODEL: dummy
      EMBED_MODEL: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Import check
        run: python -c "import query, ingest, app"
      - name: Eval set shape
        run: |
          python - <<'PY'
          import json
          rows = [json.loads(l) for l in open("eval/cases.jsonl", encoding="utf-8") if l.strip()]
          kinds = [r["type"] for r in rows]
          assert len(rows) == 12, len(rows)
          assert kinds.count("out_of_scope") == 3, kinds
          print("cases ok:", len(rows))
          PY
